<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class-05</title>
</head>

<body>
  <h1>Hello, Everyone</h1>
  <h2 class="heading">It's ME</h2>
  <h3 id="nothing">Nothing to say</h3>
  <button onclick="darkMode()">Dark-Light-Toggle</button>
  <style>
    .darkMode {
      background-color: black;
      color: white;
    }
  </style>
  <button id="darkBtn">Dark-Mode</button>
  <button id="lightBtn">Light-Mode</button><br><br>
  <input type="text" placeholder="Your Name" id="nameInput">
  <br><br>
  <button id="btn">Click</button><br><br>

  <h3>Multiplication Table</h3>
  <input type="text" placeholder="Enter Number For Multiplication Tables" id="multiNumber">
  <br><br>
  <button id="startBtn">Start</button>
  <h1 id="result"></h1>

  <h3>Result Checker</h3>
  <input type="number" placeholder="Enter Your Marks" id="marksInput">
  <br><br>
  <button id="checkBtn">Check Grade</button>
  <h1 id="yourResult"></h1>

  <script src="js/script.js"></script>
</body>

</html>
